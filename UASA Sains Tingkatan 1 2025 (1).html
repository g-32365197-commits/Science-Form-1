<html lang="ms"><head><meta charset="utf-8"><title>UASA Sains Tingkatan 1 2025</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mu:#666;--c:#f3f5f8;--ac:#1d5fd1;--ok:#0a7d3b;--no:#c62828;--bd:#d6dbe2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--fg:#eceff3;--mu:#9aa3af;--c:#1f242b;--ac:#6ea0ff;--ok:#4cc27d;--no:#ff7a7a;--bd:#323944}}
:root[data-theme="dark"]{--bg:#15181d;--fg:#eceff3;--mu:#9aa3af;--c:#1f242b;--ac:#6ea0ff;--ok:#4cc27d;--no:#ff7a7a;--bd:#323944}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.1rem;background:var(--ac);color:#fff;padding:8px 12px;border-radius:8px;margin-top:28px}
i{display:block;color:var(--mu);font-size:.92em}
.q{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:12px 0}
.d{font-size:.85em;color:var(--mu);border-left:3px solid var(--bd);padding-left:8px;margin:6px 0}
label.o{display:block;padding:6px 8px;border:1px solid transparent;border-radius:6px;cursor:pointer}
label.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
label.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
.it{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.it>span{flex:1 1 260px}
select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px}
textarea{width:100%;box-sizing:border-box;min-height:70px}
.no{color:var(--no)}.ok{color:var(--ok)}.r{font-size:.9em}
.m{display:none;margin-top:6px;padding:8px;border:1px dashed var(--ok);border-radius:6px;font-size:.92em}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 20px;cursor:pointer}
#res{display:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--c);border:2px solid var(--ac);border-radius:10px;padding:10px 14px;margin:12px 0;z-index:2}
.sm{width:60px}
img{max-width:100%;height:auto;display:block;margin:8px 0;border-radius:4px;background:#fff}table{border-collapse:collapse;width:100%;font-size:.9em}td,th{border:1px solid var(--bd);padding:4px 8px;text-align:left}
</style></head><body><main>

const BM=[2,2,2,2,2,2,2,2,2,2];
let h='<h2>Bahagian A / Section A <small>[20]</small></h2>';
A.forEach((x,i)=>{h+=`<div class="q"><b>${i+1}.</b> ${T(x[0])}${IM['a'+i]?`<img src="${IM['a'+i]}" alt="">`:(x[1]?`<div class="d">${x[1]}</div>`:'')}`;x[2].forEach((o,j)=>h+=`<label class="o" id="a${i}_${j}"><input type="radio" name="a${i}" value="${j}"> <b>${L[j]}</b> ${T(o)}</label>`);h+='</div>'});
h+='<h2>Bahagian B / Section B <small>[20]</small></h2>';
B.forEach((p,pi)=>{h+=`<div class="q"><b>${T(p[0])}</b>${IM['b'+pi]?`<img src="${IM['b'+pi]}" alt="">`:''}`;p[1].forEach((it,ii)=>{const id=`b${pi}_${ii}`;h+=`<div class="it"><span>${it.k=='c'?`<label><input type="checkbox" id="${id}"> ${T(it.q)}</label>`:T(it.q)}</span>`;if(it.k!='c')h+=`<select id="${id}"><option value="-1">—</option>${it.o.map((o,j)=>`<option value="${j}">${P(o)}</option>`).join('')}</select>`;h+=`<span class="r" id="r${id}"></span></div>`});h+='</div>'});
$('app').innerHTML=h;
let sa=0,sb=0;
function show(){$('res').innerHTML=`<b>${$('nm').value||''} ${$('kl').value||''}</b><br>A: ${sa}/20 · B: ${sb}/20<br><b>Jumlah / Total: ${sa+sb}/40</b>`}
$('sb').onclick=()=>{
 if(!$('nm').value.trim()){alert('Sila isi nama / Please enter your name');return}
 A.forEach((x,i)=>{const r=document.querySelector(`input[name=a${i}]:checked`);if(r&&+r.value==x[3])sa++;else if(r)$(`a${i}_${r.value}`).classList.add('no');$(`a${i}_${x[3]}`).classList.add('ok')});
 B.forEach((p,pi)=>{let c=0;p[1].forEach((it,ii)=>{const id=`b${pi}_${ii}`,e=$(id),v=it.k=='c'?(e.checked?1:0):+e.value,ok=v==it.a;if(ok)c++;$('r'+id).innerHTML=ok?'<b class="ok">✓</b>':'<b class="no">✗</b> '+(it.k=='c'?(it.a?'✓ tick':'leave blank'):P(it.o[it.a]))});sb+=Math.round(BM[pi]*c/p[1].length*2)/2});
 document.querySelectorAll('input[type=radio],input[type=checkbox],select').forEach(e=>e.disabled=true);
 $('res').style.display='block';$('sb').style.display='none';show();save();window.scrollTo(0,0)};

let db=null,uid=null;
async function save(){const st=$('st');if(!db||!uid){st.textContent='Markah tidak disimpan kepada guru (log masuk melalui pautan guru) / Not sent to teacher (sign in via the teacher link)';return}
try{const a=A.map((x,i)=>{const r=document.querySelector(`input[name=a${i}]:checked`);return r?+r.value:-1}),b=[];B.forEach((p,pi)=>p[1].forEach((it,ii)=>{const e=$(`b${pi}_${ii}`);b.push(it.k=='c'?(e.checked?1:0):+e.value)}));
await db.doc('submissions/'+uid).set({name:$('nm').value.trim(),kelas:$('kl').value.trim(),a:sa,b:sb,ans:{a,b},at:Date.now()});st.textContent='✓ Jawapan dihantar kepada guru / Sent to teacher'}catch(e){st.textContent='Gagal dihantar / Could not send'}}
function tp(){$('tp').innerHTML='<p><button id="tb">Keputusan pelajar / Student results</button></p><div id="tr"></div>';$('tb').onclick=async()=>{const q=await db.collection('submissions').get();const r=q.docs.map(x=>x.data()).sort((a,b)=>(a.kelas+a.name).localeCompare(b.kelas+b.name));$('tr').innerHTML=`<table><tr><th>Nama</th><th>Kelas</th><th>A</th><th>B</th><th>Jumlah</th></tr>${r.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.kelas)}</td><td>${x.a}</td><td>${x.b}</td><td>${x.a+x.b}/40</td></tr>`).join('')}</table><p>${r.length} pelajar / students</p>`}}
(async()=>{try{db=await claude.use('db');const u=await claude.use('user');if(db&&u){uid=await u.id();const s=await db.doc('submissions/'+uid).get();if(s.exists){const d=s.data();$('app').innerHTML='';$('sb').style.display='none';$('res').style.display='block';$('res').innerHTML=`<b>Anda sudah menghantar / Already submitted</b><br>${esc(d.name)} ${esc(d.kelas)}<br>A: ${d.a}/20 · B: ${d.b}/20 · <b>${d.a+d.b}/40</b>`}if(await u.canEdit())tp()}}catch(e){}})();
